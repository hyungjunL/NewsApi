<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .login-container h2 { margin-bottom: 20px; }
        .login-form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .login-form button { width: 100%; padding: 10px; border: none; border-radius: 4px; background-color: #007bff; color: white; font-size: 16px; cursor: pointer; }
        .login-form button:hover { background-color: #0056b3; }
        .divider { margin: 20px 0; font-size: 14px; color: #888; }
        .oauth-login a { display: block; padding: 10px; border-radius: 4px; text-decoration: none; color: #333; background-color: #f8f9fa; border: 1px solid #ddd; }
        .oauth-login a:hover { background-color: #e2e6ea; }
        .error-message { color: red; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>로그인</h2>

    <!-- 로그인 실패 시 에러 메시지 표시 -->
    <div th:if="${param.error}" class="error-message">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 일반 폼 로그인 -->
    <form class="login-form" th:action="@{/login-proc}" method="post">
        <!-- Spring Security는 기본적으로 input의 name을 'username', 'password'로 기대합니다. -->
        <input type="text" name="username" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>

    <!-- [추가] 회원가입 링크 -->
    <div style="margin-top: 15px; font-size: 14px;">
        계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
    </div>


    <div class="divider">또는</div>

    <!-- OAuth2 소셜 로그인 -->
    <div class="oauth-login">
        <!-- Google 로그인 버튼: 이 링크를 클릭하면 OAuth2 로그인 프로세스가 시작됩니다. -->
        <a href="/oauth2/authorization/google">Google로 로그인</a>
    </div>
</div>
</body>
</html>
